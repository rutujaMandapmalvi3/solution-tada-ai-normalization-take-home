# UKG Ready compensation history: GET .../employees/{aid}/compensation/history.
# Wrapped as {compensation_history: <body>} and merged into the employee by
# canonical id; employee_id from params.aid. Rule moved unchanged from employee.yaml.
version: 1
provider: ukg-ready
entity: employee
fields:
- kind: field
  source: employee_id
  source_scope: context
  target: employee_id
- kind: object
  source: compensation_history
  target: provider_fields.ukg-ready.compensation_history
  fields:
  - kind: list
    source: compensations
    target: compensations
    fields:
    - kind: field
      source: id
      target: id
      transform:
        name: identifier
    - kind: object
      source: employee
      target: employee
      fields:
      - kind: field
        source: account_id
        target: account_id
        transform:
          name: identifier
    - kind: field
      source: effective_from
      target: effective_from
      transform:
        name: date
    - kind: field
      source: amount
      target: amount
    - kind: field
      source: hourly_pay
      target: hourly_pay
    - kind: field
      source: currency
      target: currency
    - kind: field
      source: amount_period
      target: amount_period
    - kind: field
      source: time
      target: time
    - kind: field
      source: time_period
      target: time_period
    - kind: field
      source: num_pp_in_year
      target: num_pp_in_year
