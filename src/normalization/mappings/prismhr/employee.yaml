# PrismHR employee mapping: one validated PrismHREmployee per execution.
# Shared fields appear first; provider-specific objects/lists follow.
# The engine supplies provider. The adapter supplies context.client_id.
# Wrapper errorCode/errorMessage/infoMessage/updateMessage/extension stay in
# source_metadata via the engine's metadata argument, not employee field rules.
# response.employee is the wrapper's record collection, not a second employee field.
# Nested unknown fields are preserved by the engine, not enumerated here.
#
# The shared mapping engine uses these rules for PrismHR employees.
# The engine supports the identifier, date, label, number and postal_code helpers
# used here; the adapter supplies validated employees and wrapper metadata.
# Labels use only documented meanings or explicitly accepted user assumptions:
# gender M/F/X/D meanings and U=unknown are user assumptions/extensions; B is unmapped.
# An empty labels table for employeeStatus/employeeType means NO verified dictionary:
# preserve the original code + a mapping issue and leave the descriptive field null.
# Blank label input stays blank unless explicitly mapped (rehire blank=no preference).
# Unknown label input is preserved in original_values, never guessed.
# No currency, percentage-scale, frequency or amount-basis conversion is performed.
# Numeric/date conversions keep original values according to the proposal contract.

