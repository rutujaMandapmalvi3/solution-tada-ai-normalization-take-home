# prismhr company rules: one validated PrismHRClientMaster per map() call.
# The connected adapter supplies internal context.source_record_type="client".
# This is a fixed source-record role, NOT a new user input-type/CLI option.
# id maps to source_record_id; no global company ID or cross-provider join is inferred.
# Shared names/tax/NAICS fields use only the proposal's verified semantic matches.
# Other known fields retain separate provider scope and explicit snake_case names.
# Record links/unconsumed fields keep source nesting under provider_fields.prismhr.unmapped.
# Unknown fields retain source nesting under source_extras.prismhr.
# Source wrappers are preserved by the adapter, outside this record YAML.
# Existing helpers only; no new helper, engine or source-model implementation.
# The adapter unwraps clientMaster and preserves errorCode/errorMessage/extension.
# statusClass uses its exact class dictionary; status remains raw, not class-translated.
# Mixed string/integer dates and unclear numeric strings remain unchanged.

