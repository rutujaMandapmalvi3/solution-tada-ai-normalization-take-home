# isolved employee mapping: one validated IsolvedEmployeeInput per execution.
# Uses the primary Swagger v6 only; no Corestream gender-code dictionary is reused.
# Source fields retain their names; provider-owned output keys use snake_case.
# Objects, arrays and salary_history retain their boundaries and item order.
# salary_history belongs to this employee; this file does not join a standalone
# salary-history response to an employee or infer ownership from array position.
#
# This rule file is used by isolved normalize_employees().
# The engine supports both the pronouns helper and Boolean label inputs.
# eligibleForRehire is a Boolean: label uses the explicit string keys
# "true"/"false" below to produce eligible/ineligible, not guess Boolean meanings.
# Pronouns: one supplied value or exact agreement -> one canonical value;
# conflicting nonblank values -> null, preserve both originals and record an issue.
#
# label dictionaries contain readable canonical words, not inferred provider codes.
# The label helper already matches readable values case-insensitively (Male, Married).
# No employment-category meanings are verified: copy employmentCategoryCode
# unchanged to provider_fields.isolved.employment_category_code. Do not populate
# descriptive employment_type or guess full-time/part-time.
# Reporting override, ethnicity, legal references, organization lists and work-location
# descriptions remain separate. No money/unit/frequency conversion is introduced.
#
# Paging wrappers (nextPageUrl/previousPageUrl/results/totalItems/totalPages) are
# processed by the adapter, outside this per-employee rule file.
# Declared links and their nested fields are intentionally left to the engine's
# existing preservation fallback: provider_fields.isolved.unmapped, original nesting.
# They are NOT discarded or relabeled as employee business fields. The engine
# currently owns source_metadata, so YAML cannot write link rules into that branch.
# Unknown fields are preserved separately by the engine in source_extras.isolved.
# Future adapter metadata handling can carry paging/link context without engine edits.

