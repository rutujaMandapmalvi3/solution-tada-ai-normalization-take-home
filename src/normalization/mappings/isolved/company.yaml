# isolved company rules: one validated IsolvedLegalModel per map() call.
# The connected adapter supplies internal context.source_record_type="legal_company".
# This is a fixed source-record role, NOT a new user input-type/CLI option.
# id maps to source_record_id; no global company ID or cross-provider join is inferred.
# Shared names/tax/NAICS fields use only the proposal's verified semantic matches.
# Other known fields retain separate provider scope and explicit snake_case names.
# Record links/unconsumed fields keep source nesting under provider_fields.isolved.unmapped.
# Unknown fields retain source nesting under source_extras.isolved.
# Source wrappers are preserved by the adapter, outside this record YAML.
# Existing helpers only; no new helper, engine or source-model implementation.
# Parent client data is NOT this legal company's own name/identity/settings.
# Recursive client.legalCompanies back-references project only nested record IDs;
# other supplied values remain in the engine fallback at original source positions.
# No recursive schema expansion, fetching, deduplication or parent joins occurs.

