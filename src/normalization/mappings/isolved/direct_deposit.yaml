# isolved direct_deposit: one validated IsolvedEmployeeDirectDepositModel per engine.map() call.
# This file maps records, not wrappers; the adapter validates/unwraps the response.
# Existing helpers only. No changes to helper code, the engine or adapters.
# Record links retain source nesting in provider_fields.isolved.unmapped.
# Undeclared fields retain nesting in source_extras.isolved; wrappers/context
# and parent settings belong to result metadata/provider fields, not fake records.
# Source-specific fields stay separate; no inferred joins, scale or currency conversion.
# Adapter supplies employee_id context; this response schema has no employee owner to cross-check.
# Paycheck payments stay in payroll; no HSA setup is included here.
# Only Checking was verified in the saved response; unknown account-type labels
# remain in original_values with a mapping issue, not an invented code dictionary.

version: 1
provider: isolved
entity: direct_deposit
fields:
- kind: field
  source: id
  target: deposit_id
  transform:
    name: identifier
- kind: field
  source: accountNumber
  target: account_number
- kind: field
  source: accountType
  target: account_type
  transform:
    name: label
    arguments:
      labels:
        Checking: checking
- kind: field
  source: amount
  target: allocation_amount
  transform:
    name: number
- kind: field
  source: bankName
  target: bank_name
- kind: field
  source: description
  target: provider_fields.isolved.description
- kind: field
  source: frequency
  target: provider_fields.isolved.frequency
- kind: field
  source: percent
  target: allocation_percentage
  transform:
    name: number
- kind: field
  source: routingNumber
  target: routing_number
- kind: field
  source: sequenceNumber
  target: sequence
- kind: field
  source: status
  target: provider_fields.isolved.status
- kind: field
  source: employee_id
  target: employee_id
  source_scope: context
  transform:
    name: identifier
