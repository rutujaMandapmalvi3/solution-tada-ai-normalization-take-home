[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "normalization"
version = "0.1.0"
description = "Normalize PrismHR, isolved and UKG Ready data into one canonical model."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12", "PyYAML>=6.0", "jsonschema>=4.18", "referencing>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
normalization = "normalization.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
normalization = ["mappings/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
